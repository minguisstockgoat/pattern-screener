name: daily-screen

on:
  schedule:
    - cron: "45 9 * * 1-5"   # 18:45 KST 평일 (당일 데이터가 이미 반영된 경우)
    - cron: "15 23 * * 0-4"  # 08:15 KST 화~토 (KRX OPEN API T+1 아침 갱신 보강)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run screener
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TZ: Asia/Seoul
        run: python scripts/screen.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "data: screen update $(TZ=Asia/Seoul date +%F)"
            git push
          fi
